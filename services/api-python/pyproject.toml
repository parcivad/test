[project]
name = "api-python"
version = "0.1.0"
description = "Der Berichts-Dienst des Monorepos."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
api-python = "api_python.server:main"
